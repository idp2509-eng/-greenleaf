<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Меню — Green Leaf</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h2>Наші страви</h2>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <span class="muted" id="found"></span>
    <input id="q" type="search" placeholder="Пошук страви..." aria-label="Пошук страви">
    <select id="sort" aria-label="Сортування">
      <option value="">Рекомендовані</option>
      <option value="asc">Дешевші спочатку</option>
      <option value="desc">Дорожчі спочатку</option>
      <option value="name">За назвою</option>
    </select>
  </div>
  <section class="grid" id="menuGrid" style="margin-top:16px"></section>
</main>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
